name: Release APKG on main

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  queue: max

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test templates
        run: npm run test:all-js

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaging dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Build APKG
        run: python scripts/build_apkg.py dist/LapisChinese.apkg

      - name: Test APKG
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Publish patch release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          asset="dist/LapisChinese.apkg"
          tag=""

          for attempt in {1..20}; do
            git fetch --force --tags origin
            decision="$(python scripts/release_policy.py "${GITHUB_SHA}")"
            read -r tag_status tag <<< "${decision}"
            if [[ "${tag_status}" == "existing" ]]; then
              break
            fi
            git tag "${tag}" "${GITHUB_SHA}"

            if git push origin "refs/tags/${tag}:refs/tags/${tag}"; then
              break
            fi

            git tag --delete "${tag}"
            tag=""
            sleep 2
          done

          if [[ -z "${tag}" ]]; then
            echo "Unable to allocate the next release version" >&2
            exit 1
          fi

          title="Lapis Chinese ${tag}"
          git fetch --force origin main:refs/remotes/origin/main
          is_head=false
          if [[ "$(git rev-parse refs/remotes/origin/main)" == "${GITHUB_SHA}" ]]; then
            is_head=true
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${asset}#LapisChinese.apkg" --clobber
            edit_args=(--title "${title}")
            if [[ "${is_head}" == "true" ]]; then
              edit_args+=(--latest)
            fi
            gh release edit "${tag}" "${edit_args[@]}"
          else
            latest_arg="--latest=false"
            if [[ "${is_head}" == "true" ]]; then
              latest_arg="--latest"
            fi
            gh release create "${tag}" "${asset}#LapisChinese.apkg" \
              --title "${title}" \
              --generate-notes \
              "${latest_arg}" \
              --verify-tag
          fi
