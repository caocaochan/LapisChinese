name: Release APKG on main

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test templates
        run: npm run test:all-js

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaging dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Build APKG
        run: python scripts/build_apkg.py dist/LapisChinese.apkg

      - name: Test APKG
        run: python -m unittest tests.test_package

      - name: Publish commit release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::12}"
          tag="main-${short_sha}"
          title="Lapis Chinese ${short_sha}"
          asset="dist/LapisChinese.apkg"

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${asset}#LapisChinese.apkg" --clobber
            gh release edit "${tag}" --latest
          else
            gh release create "${tag}" "${asset}#LapisChinese.apkg" \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --generate-notes \
              --latest
          fi
